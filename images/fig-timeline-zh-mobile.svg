<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 608" width="420" height="608" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>Luckey 的路線：從 Oculus 到 Meridian</title>
<desc>Luckey 與 Anduril 的重要節點時間軸：2014 年 Oculus 賣給 Facebook，2017 年離開並成立 Anduril，2025 年接手 IVAS，2026 年 Erebor、Anduril 募資、Meridian 專案與這場對談。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="420" height="608" fill="#fbfaf7"/>
<text x="24" y="42" font-size="18" fill="#1f3a5f" font-weight="bold" text-anchor="start">Luckey 的路線：從 Oculus 到 Meridian</text>
<line x1="36" y1="76" x2="36" y2="564" stroke="#c9ccd4" stroke-width="3"/>
<circle cx="36" cy="92" r="8" fill="#1f3a5f"/>
<text x="60" y="94" font-size="16" fill="#1f3a5f" font-weight="bold" text-anchor="start">2014</text>
<text x="60" y="120" font-size="16" fill="#1d2433" text-anchor="start">Oculus 以約 20 億美元賣給 Facebook</text>
<circle cx="36" cy="166" r="8" fill="#1f3a5f"/>
<text x="60" y="168" font-size="16" fill="#1f3a5f" font-weight="bold" text-anchor="start">2017</text>
<text x="60" y="194" font-size="16" fill="#1d2433" text-anchor="start">離開 Facebook，同年成立 Anduril</text>
<circle cx="36" cy="240" r="8" fill="#1f3a5f"/>
<text x="60" y="242" font-size="16" fill="#1f3a5f" font-weight="bold" text-anchor="start">2025</text>
<text x="60" y="268" font-size="16" fill="#1d2433" text-anchor="start">接手 IVAS，並與 Meta 合作</text>
<circle cx="36" cy="314" r="8" fill="#1f3a5f"/>
<text x="60" y="316" font-size="16" fill="#1f3a5f" font-weight="bold" text-anchor="start">2026 年 2 月</text>
<text x="60" y="342" font-size="16" fill="#1d2433" text-anchor="start">Erebor 銀行取得執照開業</text>
<circle cx="36" cy="388" r="8" fill="#1f3a5f"/>
<text x="60" y="390" font-size="16" fill="#1f3a5f" font-weight="bold" text-anchor="start">2026 年 5 月</text>
<text x="60" y="416" font-size="16" fill="#1d2433" text-anchor="start">Anduril 募資 50 億美元</text>
<circle cx="36" cy="462" r="8" fill="#1f3a5f"/>
<text x="60" y="464" font-size="16" fill="#1f3a5f" font-weight="bold" text-anchor="start">2026 年 9 月</text>
<text x="60" y="490" font-size="16" fill="#1d2433" text-anchor="start">Meridian 專案宣布</text>
<circle cx="36" cy="536" r="8" fill="#d9822b"/>
<text x="60" y="538" font-size="16" fill="#1f3a5f" font-weight="bold" text-anchor="start">2026 年 11 月</text>
<text x="60" y="564" font-size="16" fill="#1d2433" text-anchor="start">DealBook 對談</text>
</svg>
