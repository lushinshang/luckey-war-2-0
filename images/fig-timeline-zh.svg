<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 534" width="980" height="534" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>Luckey 的路線：從 Oculus 到 Meridian</title>
<desc>Luckey 與 Anduril 的重要節點時間軸：2014 年 Oculus 賣給 Facebook，2017 年離開並成立 Anduril，2025 年接手 IVAS，2026 年 Erebor、Anduril 募資、Meridian 專案與這場對談。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="980" height="534" fill="#fbfaf7"/>
<text x="40" y="46" font-size="24" fill="#1f3a5f" font-weight="bold" text-anchor="start">Luckey 的路線：從 Oculus 到 Meridian</text>
<line x1="250" y1="80" x2="250" y2="494" stroke="#c9ccd4" stroke-width="3"/>
<circle cx="250" cy="100" r="9" fill="#1f3a5f"/>
<text x="226" y="106" font-size="19" fill="#1f3a5f" font-weight="bold" text-anchor="end">2014</text>
<text x="278" y="106" font-size="19" fill="#1d2433" text-anchor="start">Oculus 以約 20 億美元賣給 Facebook</text>
<circle cx="250" cy="162" r="9" fill="#1f3a5f"/>
<text x="226" y="168" font-size="19" fill="#1f3a5f" font-weight="bold" text-anchor="end">2017</text>
<text x="278" y="168" font-size="19" fill="#1d2433" text-anchor="start">離開 Facebook，同年成立 Anduril</text>
<circle cx="250" cy="224" r="9" fill="#1f3a5f"/>
<text x="226" y="230" font-size="19" fill="#1f3a5f" font-weight="bold" text-anchor="end">2025</text>
<text x="278" y="230" font-size="19" fill="#1d2433" text-anchor="start">接手 IVAS，並與 Meta 合作</text>
<circle cx="250" cy="286" r="9" fill="#1f3a5f"/>
<text x="226" y="292" font-size="19" fill="#1f3a5f" font-weight="bold" text-anchor="end">2026 年 2 月</text>
<text x="278" y="292" font-size="19" fill="#1d2433" text-anchor="start">Erebor 銀行取得執照開業</text>
<circle cx="250" cy="348" r="9" fill="#1f3a5f"/>
<text x="226" y="354" font-size="19" fill="#1f3a5f" font-weight="bold" text-anchor="end">2026 年 5 月</text>
<text x="278" y="354" font-size="19" fill="#1d2433" text-anchor="start">Anduril 募資 50 億美元</text>
<circle cx="250" cy="410" r="9" fill="#1f3a5f"/>
<text x="226" y="416" font-size="19" fill="#1f3a5f" font-weight="bold" text-anchor="end">2026 年 9 月</text>
<text x="278" y="416" font-size="19" fill="#1d2433" text-anchor="start">Meridian 專案宣布</text>
<circle cx="250" cy="472" r="9" fill="#d9822b"/>
<text x="226" y="478" font-size="19" fill="#1f3a5f" font-weight="bold" text-anchor="end">2026 年 11 月</text>
<text x="278" y="478" font-size="19" fill="#1d2433" text-anchor="start">DealBook 對談</text>
</svg>
