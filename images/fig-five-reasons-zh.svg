<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 570" width="980" height="570" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>戰爭部改名的五個理由（示意圖）</title>
<desc>依講者在 7:01 到 9:19 的說法整理：嚇阻、透明與預算、目標明確、士氣、排斥反對者；他說這五點沒有按重要性排序。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="980" height="570" fill="#fbfaf7"/>
<text x="40" y="48" font-size="24" fill="#1f3a5f" font-weight="bold" text-anchor="start">Luckey 列的五個理由</text>
<rect x="40" y="80" width="200" height="62" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.8"/>
<text x="140.0" y="117.3" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">嚇阻</text>
<rect x="250" y="80" width="690" height="62" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.8"/>
<text x="276" y="118" font-size="18" fill="#1d2433" text-anchor="start">名稱要讓全世界一看就懂用途</text>
<rect x="40" y="156" width="200" height="62" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.8"/>
<text x="140.0" y="193.3" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">透明與預算</text>
<rect x="250" y="156" width="690" height="62" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.8"/>
<text x="276" y="194" font-size="18" fill="#1d2433" text-anchor="start">用防衛當名目，花錢就沒有上限</text>
<rect x="40" y="232" width="200" height="62" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.8"/>
<text x="140.0" y="269.3" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">目標明確</text>
<rect x="250" y="232" width="690" height="62" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.8"/>
<text x="276" y="270" font-size="18" fill="#1d2433" text-anchor="start">什麼都想做，就一事無成</text>
<rect x="40" y="308" width="200" height="62" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.8"/>
<text x="140.0" y="345.3" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">士氣</text>
<rect x="250" y="308" width="690" height="62" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.8"/>
<text x="276" y="346" font-size="18" fill="#1d2433" text-anchor="start">國防部輸掉每場戰爭，戰爭部贏了每場</text>
<rect x="40" y="384" width="200" height="62" rx="10" fill="#1f3a5f" stroke="#1f3a5f" stroke-width="1.8"/>
<text x="140.0" y="421.3" font-size="18" fill="#ffffff" font-weight="bold" text-anchor="middle">排斥反對者</text>
<rect x="250" y="384" width="690" height="62" rx="10" fill="#ffffff" stroke="#c9ccd4" stroke-width="1.8"/>
<text x="276" y="422" font-size="18" fill="#1d2433" text-anchor="start">驅逐錯的人，免得成為組織的毒瘤</text>
<text x="40" y="500" font-size="14" fill="#566075" text-anchor="start">依講者 7:01–9:19 的說法整理</text>
<text x="40" y="524" font-size="14" fill="#566075" text-anchor="start">他說這五點沒有按重要性排序</text>
</svg>
